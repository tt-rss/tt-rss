worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
	include /etc/nginx/mime.types;
	default_type  application/octet-stream;

	access_log /dev/stdout;
	error_log /dev/stderr warn;

	sendfile on;

	# nginx's mime.types has an entry for neither .webmanifest nor .ttf, so both
	# would otherwise fall back to default_type.  For the font that is not just
	# cosmetic: gzip_types below cannot match a type the file never gets.
	types {
		application/manifest+json  webmanifest;
		font/ttf                   ttf;
	}

	gzip on;

	# nginx defaults to 1, which on tt-rss's own assets gives up about 16% of
	# the achievable saving.  Level 6 captures nearly all of it (15.5% of 16.0%
	# on the headlines JSON) for roughly 0.6ms more per response; 7-9 buy a
	# further 0.5% and are only worth paying for offline, via gzip_static.
	gzip_comp_level 6;

	# Serve a precompressed <file>.gz when one exists (see
	# utils/precompress-assets.sh), which allows level 9 at no request-time cost.
	gzip_static on;

	# image/svg+xml was missing: images/three-dots.svg is on the critical path
	# for every page load and compresses 1513 -> 395 bytes.
	#
	# font/ttf covers lib/flat-ttrss's icon font, which every page load needs for
	# dijit's tab, arrow, checkbox and validation glyphs.  It ships as .ttf and
	# .woff, and the .ttf wins the @font-face cascade, so it was going out at its
	# full 13436 bytes; gzipped it is 4700.  woff and woff2 are left out on
	# purpose: a correctly built one is already compressed internally, so gzip
	# only burns CPU -- material-icons.woff2 comes out 59 bytes *larger*.
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json font/ttf;

	# Only effective for static files.  PHP responses arrive over FastCGI with
	# Transfer-Encoding: chunked and no Content-Length, so nginx cannot know
	# their size and compresses them regardless of this setting.  Lowered from
	# 1024 so the smaller SVGs are covered.
	gzip_min_length 256;

	gzip_proxied any;
	gzip_vary on;

	# Deliberately not tuning fastcgi_buffers here.  PHP responses arrive in
	# chunks and the compressor flushes at each boundary, but for gzip the cost
	# is negligible: raising the buffers from 32k to 2M per request moved the
	# headlines JSON only from 17,150 to 17,124 bytes, against 17,112 for the
	# same body compressed offline.  The defaults are already at the ceiling.

	# Static assets are served without any Cache-Control, which leaves browsers
	# to guess a freshness lifetime and revalidate once their guess expires.
	# Most asset URLs already carry a version token, so they need neither:
	# javascript_tag() and stylesheet_tag() append ?filemtime() (see
	# include/controls_compat.php), get_theme_path() does the same, and dojo's
	# loader appends dojoConfig.cacheBust to every module it fetches lazily
	# (see index.php).  Such a URL changes whenever its file does, so the
	# response behind it can be cached indefinitely.
	#
	# This keys on the query string rather than on the path, deliberately.  A
	# minority of requests still arrive with no version at all -- currently
	# around 6% of the dojo module fetches in an access log, plus the favicons
	# and the web manifest, which are never versioned.  A path-based rule would
	# hand those a year of immutability and serve stale JavaScript after an
	# upgrade; keyed this way they simply keep revalidating, which costs a round
	# trip and no body.
	#
	# The token is matched as bare alphanumerics rather than digits only, because
	# tt-rss's own ?filemtime() is not the only scheme in the tree: vendored
	# bundles bake in a build token, e.g. lib/flat-ttrss asks for its icon font
	# as ?90nq1s.  Requiring the whole query string to be one such word is what
	# keeps this narrow -- a key=value pair cannot match for want of an '=', so
	# public.php?op=feed_icon&id=1 stays on no-cache.  Over a sample access log
	# it moved exactly one thing into the immutable bucket, that font.
	#
	# Caveat for anyone editing a vendored asset: a baked token, unlike
	# filemtime, is not derived from the file, so replacing such a file without
	# regenerating the stylesheet that references it leaves clients holding the
	# old copy for a year.
	map $args $ttrss_static_cache {
		default                "no-cache";
		"~^[0-9a-zA-Z]+$"      "public, max-age=31536000, immutable";
	}

	index index.php;

	resolver ${RESOLVER} valid=5s;

	server {
		listen 80;
		listen [::]:80;
		root ${APP_WEB_ROOT};

		location ${APP_BASE}/cache {
			aio threads;
			internal;

			# everything cached here is untrusted remote content (article media, feed
			# icons incl. SVG); keep it inert if opened as a document. X-Accel-Redirect
			# doesn't forward custom headers set by PHP, so this has to live here.
			add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
			add_header X-Content-Type-Options nosniff always;
		}

		location ${APP_BASE}/backups {
			internal;
		}

		rewrite ${APP_BASE}/healthz ${APP_BASE}/public.php?op=healthcheck;

		# Regular PHP handling (without PATH_INFO)
		location ~ \.php$ {
			# regex to split $uri to $fastcgi_script_name and $fastcgi_path
			fastcgi_split_path_info ^(.+?\.php)(/.*)$;

			# Check that the PHP script exists before passing it
			try_files $fastcgi_script_name =404;

			fastcgi_index index.php;
			include fastcgi.conf;

			set $backend "${APP_UPSTREAM}:9000";

			fastcgi_pass ${APP_FASTCGI_PASS};
		}

		# Allow PATH_INFO for PHP files in plugins.local directories with an /api/ sub directory to allow plugins to leverage when desired
		location ~ /plugins\.local/.*/api/.*\.php(/|$) {
			# regex to split $uri to $fastcgi_script_name and $fastcgi_path
			fastcgi_split_path_info ^(.+?\.php)(/.*)$;

			# Check that the PHP script exists before passing it
			try_files $fastcgi_script_name =404;

			# Bypass the fact that try_files resets $fastcgi_path_info
			# see: http://trac.nginx.org/nginx/ticket/321
			set $path_info $fastcgi_path_info;
			fastcgi_param PATH_INFO $path_info;

			fastcgi_index index.php;
			include fastcgi.conf;

			set $backend "${APP_UPSTREAM}:9000";

			fastcgi_pass ${APP_FASTCGI_PASS};
		}

		# Only this location needs the header: PHP responses set their own
		# Cache-Control (no-store, via the session cache limiter), and the cache
		# and backups locations are internal and matched by prefix before this.
		location / {
			try_files $uri $uri/ =404;

			# No "always" here: that would apply the header to error responses
			# too, so a 404 for a versioned URL -- an asset briefly missing
			# during a deploy, say -- would be cached as immutable for a year.
			# nginx's default status list still covers 304, which browsers need
			# in order to refresh the freshness lifetime.
			add_header Cache-Control $ttrss_static_cache;
		}
	}
}
